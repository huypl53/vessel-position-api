version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: marine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vessels"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-07T00-00-00Z
    container_name: marine-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  app:
    build: .
    container_name: marine-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vessels
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vessel-images
      MINIO_REGION: us-east-1
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "5000:5000"
    volumes:
      - app-logs:/app/logs
    command: >-
      sh -c "npm run prisma:migrate && npm run start"

volumes:
  postgres-data:
  minio-data:
  app-logs:
